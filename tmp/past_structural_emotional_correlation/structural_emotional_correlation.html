<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Correlation Between Structural and Emotional Features</title>
  <script src="js/d3.v7.min.js"></script>
  <style>
    body {
      background: #F7FAFD;
      font-family: "Inter", "Arial", sans-serif;
    }
    .matrix-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(28,32,36,0.09);
      padding: 38px 34px 36px 44px;
      margin: 48px auto 0 auto;
      max-width: 1200px;
      min-width: 950px;
    }
    .matrix-title {
      font-size: 1.44rem;
      font-weight: 800;
      margin-bottom: 24px;
      color: #1A222C;
      text-align: left;
      letter-spacing: 0.01em;
    }
    .axis-label {
      font-size: 1.07rem;
      font-weight: 700;
      fill: #283449;
      cursor: default;
    }
    .cell-text {
      font-size: 1.00rem;
      font-weight: 700;
      pointer-events: none;
    }
    .cell-rect {
      stroke: #f0f2f5;
      stroke-width: 1.2px;
      shape-rendering: crispEdges;
    }
    .colorbar-label {
      font-size: 0.97rem;
      fill: #384458;
      text-anchor: end;
      font-weight: 600;
    }
    .colorbar-tick line {
      stroke: #cdd8e8;
    }
  </style>
</head>
<body>
  <div class="matrix-card">
    <div class="matrix-title">Correlation Between Structural and Emotional Features</div>
    <svg id="heatmap" width="1200" height="800"></svg>
  </div>
  <script>
    // RdBu diverging colormap (reversed so red=positive, blue=negative)
    function balancedRdBu(t) {
      return d3.interpolateRdBu(1 - t * 0.94 - 0.03);
    }

    // Load JSON file (update path if needed)
    d3.json("structural_emotional_correlation.json").then(function(data) {
      // 1. Extract unique row/column labels
      const rows = Array.from(new Set(data.map(d => d.row)));
      const cols = Array.from(new Set(data.map(d => d.column)));

      // 2. Set up layout parameters
      const cellSize = 68,
            margin = {top:90, left:235},
            width = margin.left + cols.length * cellSize + 155,
            height = margin.top + rows.length * cellSize + 90 + 60; // Add bottom margin for slanted labels

      const svg = d3.select("#heatmap")
        .attr("width", width)
        .attr("height", height);

      // 3. Color scale: -1 (blue) -> 0 (white) -> 1 (red)
      const color = d3.scaleDiverging([-1, 0, 1], balancedRdBu);

      // 4. Draw matrix cells (with soft rounded corners)
      svg.selectAll("rect.cell")
        .data(data)
        .join("rect")
        .attr("class", "cell-rect")
        .attr("x", d => margin.left + cols.indexOf(d.column) * cellSize)
        .attr("y", d => margin.top + rows.indexOf(d.row) * cellSize)
        .attr("width", cellSize)
        .attr("height", cellSize)
        .attr("rx", 8)
        .attr("ry", 8)
        .attr("fill", d => color(+d.value))
        .attr("stroke", "#f1f3f7");

      // 5. Draw matrix numbers (white if |r|>0.65, else dark)
      svg.selectAll("text.cell-value")
        .data(data)
        .join("text")
        .attr("class", "cell-text")
        .attr("x", d => margin.left + cols.indexOf(d.column) * cellSize + cellSize / 2)
        .attr("y", d => margin.top + rows.indexOf(d.row) * cellSize + cellSize / 2 + 7)
        .attr("text-anchor", "middle")
        .attr("fill", d => Math.abs(+d.value) > 0.65 ? "#fff" : "#21293A")
        .text(d => (+d.value).toFixed(3).replace(/^-0\.000$/, "0.000"));

      // 6. Draw Y axis labels (rows, left side)
      svg.selectAll("text.row-label")
        .data(rows)
        .join("text")
        .attr("class", "axis-label")
        .attr("x", margin.left - 18)
        .attr("y", (d, i) => margin.top + i * cellSize + cellSize / 2 + 10)
        .attr("text-anchor", "end")
        .attr("font-weight", 700)
        .text(d => d);

      // 7. Draw X axis labels (columns, slanted -40 deg, close to matrix)
      svg.selectAll("text.col-label-bottom")
        .data(cols)
        .join("text")
        .attr("class", "axis-label col-label-bottom")
        .attr("x", (d, i) => margin.left + i * cellSize + cellSize / 2)
        .attr("y", margin.top + rows.length * cellSize + 20)   // close to matrix, 20px gap
        .attr("text-anchor", "end")
        .attr("font-size", "1.02rem")
        .attr("fill", "#283449")
        .attr("transform", (d, i) =>
          `rotate(-40, ${margin.left + i * cellSize + cellSize / 2}, ${margin.top + rows.length * cellSize + 20})`
        )
        .text(d => d);

      // 8. Draw colorbar (vertical, right side)
      const colorbarHeight = 326, colorbarWidth = 16, colorbarX = width - 68, colorbarY = margin.top + 10;
      const defs = svg.append("defs");
      const gradient = defs.append("linearGradient")
        .attr("id", "colorbar-gradient")
        .attr("x1", "0%").attr("y1", "100%")
        .attr("x2", "0%").attr("y2", "0%");
      for (let i = 0; i <= 100; i++) {
        gradient.append("stop")
          .attr("offset", `${i}%`)
          .attr("stop-color", balancedRdBu(i/100));
      }
      svg.append("rect")
        .attr("x", colorbarX)
        .attr("y", colorbarY)
        .attr("width", colorbarWidth)
        .attr("height", colorbarHeight)
        .style("fill", "url(#colorbar-gradient)");

      // 9. Draw colorbar axis (with numbers)
      const cbScale = d3.scaleLinear().domain([-1, 1]).range([colorbarY + colorbarHeight, colorbarY]);
      const cbAxis = d3.axisRight(cbScale)
        .ticks(8)
        .tickFormat(d3.format(".2f"));
      svg.append("g")
        .attr("transform", `translate(${colorbarX + colorbarWidth + 6},0)`)
        .call(cbAxis)
        .selectAll("text")
        .attr("class", "colorbar-label");
      svg.selectAll(".tick").classed("colorbar-tick", true);
    });
  </script>
</body>
</html>
